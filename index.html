<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Сметана AI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>

    <style>
        :root {
            --bg: #07070b; --sb-bg: #0c0b12; --card: #14121c; --bd: rgba(255, 255, 255, .08); --bd2: rgba(255, 255, 255, .15);
            --tx: #EDE9E3; --mut: #8d8a94; --user-bg: rgba(255, 255, 255, .06); --input-bg: #14121c;
            --code-bg: #0d0d12; --code-head: rgba(255, 255, 255, .04); --msg-att: rgba(0, 0, 0, 0.3);
            --btn-code-tx: #b9b4c4; --btn-code-hover: #fff; --btn-code-bd: rgba(255, 255, 255, .15);
            --badge-tx: #17131f; --grad: linear-gradient(120deg, #FFE3A3, #FFB8D9 45%, #B3A8FF); --accent: #FFB8D9;
        }
        [data-theme="light"] {
            --bg: #f9f9fb; --sb-bg: #ffffff; --card: #ffffff; --bd: rgba(0, 0, 0, .08); --bd2: rgba(0, 0, 0, .15);
            --tx: #1d1d1f; --mut: #55555a; --user-bg: #f0f0f5; --input-bg: #ffffff;
            --code-bg: #f6f8fa; --code-head: #eaeef2; --msg-att: rgba(0, 0, 0, 0.05);
            --btn-code-tx: #57606a; --btn-code-hover: #24292f; --btn-code-bd: #d0d7de; --badge-tx: #17131f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        [hidden] { display: none !important; }
        body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); color: var(--tx); font-family: Manrope, system-ui, sans-serif; display: flex; overflow: hidden; -webkit-text-size-adjust: 100%; transition: background 0.3s, color 0.3s; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bd2); border-radius: 100px; }
        .sidebar { width: 260px; flex-shrink: 0; background: var(--sb-bg); border-right: 1px solid var(--bd); display: flex; flex-direction: column; height: 100%; z-index: 50; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s; }
        .sb-head { padding: 16px 20px; border-bottom: 1px solid var(--bd); flex-shrink: 0; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
        .lm { width: 32px; height: 32px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; box-shadow: 0 6px 20px -6px rgba(255, 184, 217, .6); }
        .lm svg { width: 16px; height: 16px; }
        .lt { font-family: Unbounded, sans-serif; font-size: 14px; font-weight: 700; }
        .lt span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .sb-body { padding: 12px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; overscroll-behavior: contain; }
        .sb-btn { width: 100%; padding: 10px; border-radius: 8px; border: 1px dashed var(--bd2); background: transparent; color: var(--tx); font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s; text-align: left; touch-action: manipulation; }
        .sb-btn:hover { background: rgba(128, 128, 128, .1); border-color: var(--accent); }
        .sb-btn.primary { background: var(--grad); border: none; color: var(--badge-tx); justify-content: center; box-shadow: 0 4px 15px -4px rgba(255, 184, 217, .5); margin-bottom: 8px; }
        .sb-btn.primary:hover { transform: translateY(-1px); }
        .sb-title { font-size: 10px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 6px 4px; }
        .chat-item { padding: 10px 36px 10px 10px; border-radius: 8px; font-size: 12.5px; color: var(--tx); opacity: 0.8; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; transition: all 0.2s; position: relative; touch-action: manipulation; }
        .chat-item:hover { background: rgba(128, 128, 128, .1); opacity: 1; }
        .chat-item.active { background: rgba(128, 128, 128, .15); color: var(--tx); opacity: 1; font-weight: 600; }
        .chat-item .del-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); opacity: 0.4; font-size: 14px; color: var(--mut); background: transparent; border: none; cursor: pointer; transition: all 0.2s; padding: 6px; border-radius: 6px; display: grid; place-items: center; touch-action: manipulation; }
        .chat-item:hover .del-btn { opacity: 1; }
        .chat-item .del-btn:hover { background: rgba(128, 128, 128, .2); color: var(--tx); }
        .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .6); backdrop-filter: blur(4px); z-index: 45; opacity: 0; transition: opacity 0.3s; }
        .main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; position: relative; min-height: 0; }
        .top-bar { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bd); background: var(--bg); backdrop-filter: blur(10px); flex-shrink: 0; z-index: 10; }
        .top-bar-left { display: flex; align-items: center; gap: 16px; }
        .menu-toggle { display: none; background: none; border: none; color: var(--tx); font-size: 24px; cursor: pointer; padding: 4px 8px; touch-action: manipulation; }
        .model-selector-wrap { position: relative; display: flex; align-items: center; gap: 8px; }
        .model-selector { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--tx); background: rgba(128, 128, 128, .1); border: 1px solid var(--bd2); padding: 8px 14px; border-radius: 12px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .model-selector:hover { background: rgba(128, 128, 128, .15); border-color: var(--accent); }
        .model-selector .dot { width: 7px; height: 7px; border-radius: 50%; background: #6ee7a8; box-shadow: 0 0 8px #6ee7a8; }
        .model-selector .arrow { font-size: 10px; color: var(--mut); transition: transform 0.2s; }
        .model-selector.open .arrow { transform: rotate(180deg); }
        .model-dropdown { position: absolute; top: calc(100% + 8px); left: 0; background: var(--card); border: 1px solid var(--bd2); border-radius: 14px; padding: 6px; min-width: 240px; box-shadow: 0 10px 30px rgba(0, 0, 0, .15); z-index: 100; display: none; flex-direction: column; gap: 2px; animation: dropdownIn 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
        @keyframes dropdownIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .model-dropdown.open { display: flex; }
        .model-option { padding: 10px 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; transition: background 0.2s; touch-action: manipulation; }
        .model-option:hover { background: rgba(128, 128, 128, .1); }
        .model-option.active { background: rgba(128, 128, 128, .15); color: var(--tx); }
        .model-option .badge-test { font-size: 9px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; background: var(--grad); color: var(--badge-tx); padding: 3px 8px; border-radius: 6px; }
        .theme-toggle { background: rgba(128, 128, 128, .1); border: 1px solid var(--bd2); color: var(--tx); width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; transition: all 0.2s; font-size: 16px; }
        .theme-toggle:hover { background: rgba(128, 128, 128, .2); }
        .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; scroll-behavior: smooth; overscroll-behavior-y: contain; padding: 20px; min-height: 0; }
        .chat-inner { max-width: 760px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .msg { display: flex; gap: 12px; animation: up 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
        @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .msg.user { justify-content: flex-end; }
        .msg-content { font-size: 14.5px; line-height: 1.6; word-wrap: break-word; overflow-wrap: anywhere; }
        .msg.user .msg-content { background: var(--user-bg); padding: 10px 16px; border-radius: 16px 16px 4px 16px; border: 1px solid var(--bd); max-width: 85%; }
        .msg.assistant .msg-content { padding: 0; width: 100%; }
        .msg.system { align-self: center; justify-content: center; color: var(--mut); font-size: 12.5px; text-align: center; margin: 10px 0; }
        .msg-attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        .msg-att-img { max-width: 200px; max-height: 150px; border-radius: 8px; object-fit: cover; border: 1px solid var(--bd2); }
        .msg-att-file { background: var(--msg-att); padding: 6px 12px; border-radius: 8px; font-size: 12px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--bd); }
        #thinkingPhrase { transition: opacity 0.3s ease-in-out; margin-top: 4px; display: inline-block; }
        .md h1, .md h2, .md h3 { margin: 16px 0 8px; font-weight: 700; color: var(--tx); line-height: 1.3; }
        .md h1 { font-size: 20px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }
        .md p { margin-bottom: 10px; } .md ul, .md ol { margin: 0 0 10px 18px; } .md li { margin-bottom: 4px; }
        .md strong { font-weight: 700; color: var(--tx); }
        .md blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--mut); margin-bottom: 10px; }
        .md table { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 13px; display: block; overflow-x: auto; }
        .md th, .md td { border: 1px solid var(--bd2); padding: 6px 10px; text-align: left; word-break: break-word; }
        .md th { background: rgba(128, 128, 128, .1); font-weight: 600; }
        .md tr:nth-child(even) { background: rgba(128, 128, 128, .05); }
        .katex-display { overflow-x: auto; overflow-y: hidden; padding: 8px 0; margin: 8px 0; }
        .katex { font-size: 1.1em; }
        .code-block { margin: 14px 0; border-radius: 8px; border: 1px solid var(--bd2); background: var(--code-bg); overflow: hidden; }
        .code-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--code-head); border-bottom: 1px solid var(--bd); font-size: 11.5px; font-family: 'JetBrains Mono', monospace; color: var(--mut); }
        .code-actions { display: flex; gap: 4px; }
        .code-btn { background: transparent; border: 1px solid var(--bd); color: var(--btn-code-tx); font-size: 11px; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-family: inherit; transition: all 0.2s; display: flex; align-items: center; gap: 4px; touch-action: manipulation; }
        .code-btn:hover { background: rgba(128, 128, 128, .1); color: var(--btn-code-hover); border-color: var(--btn-code-bd); }
        .code-btn.primary { background: rgba(255, 184, 217, .15); color: #d0618e; border-color: rgba(255, 184, 217, .3); }
        [data-theme="light"] .code-btn.primary { color: #b04a73; }
        .code-block pre, .code-block code { background: transparent !important; text-shadow: none !important; margin: 0; }
        .code-block pre { padding: 12px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.5; color: var(--tx); }
        [data-theme="light"] .code-block pre, [data-theme="light"] .code-block code { color: #24292f !important; }
        [data-theme="light"] .token.comment, [data-theme="light"] .token.prolog, [data-theme="light"] .token.doctype, [data-theme="light"] .token.cdata { color: #6a737d !important; font-style: italic; }
        [data-theme="light"] .token.punctuation { color: #24292f !important; }
        [data-theme="light"] .token.property, [data-theme="light"] .token.tag, [data-theme="light"] .token.boolean, [data-theme="light"] .token.number, [data-theme="light"] .token.constant, [data-theme="light"] .token.symbol, [data-theme="light"] .token.deleted { color: #005cc5 !important; }
        [data-theme="light"] .token.selector, [data-theme="light"] .token.attr-name, [data-theme="light"] .token.string, [data-theme="light"] .token.char, [data-theme="light"] .token.builtin, [data-theme="light"] .token.inserted { color: #032f62 !important; }
        [data-theme="light"] .token.operator, [data-theme="light"] .token.entity, [data-theme="light"] .token.url, [data-theme="light"] .language-css .token.string, [data-theme="light"] .style .token.string { color: #d73a49 !important; }
        [data-theme="light"] .token.atrule, [data-theme="light"] .token.attr-value, [data-theme="light"] .token.keyword { color: #d73a49 !important; font-weight: 600; }
        [data-theme="light"] .token.function, [data-theme="light"] .token.class-name { color: #6f42c1 !important; }
        [data-theme="light"] .token.regex, [data-theme="light"] .token.important, [data-theme="light"] .token.variable { color: #e36209 !important; }
        .streaming-cursor { display: inline-block; width: 8px; height: 14px; background-color: var(--tx); vertical-align: middle; margin-left: 4px; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .input-area { padding: 16px 20px; background: var(--bg); flex-shrink: 0; display: flex; flex-direction: column; align-items: center; transition: background 0.3s; }
        .input-wrapper { max-width: 760px; width: 100%; margin: 0 auto; }
        .preview-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
        .preview-container::-webkit-scrollbar { height: 4px; }
        .preview-item { position: relative; width: 60px; height: 60px; border-radius: 10px; border: 1px solid var(--bd2); background: rgba(128, 128, 128, .1); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .preview-item .file-icon { font-size: 24px; }
        .preview-remove { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; background: rgba(0, 0, 0, 0.7); color: #fff; border: none; border-radius: 50%; font-size: 12px; cursor: pointer; display: grid; place-items: center; line-height: 1; }
        .input-box { position: relative; background: var(--input-bg); border: 1px solid var(--bd2); border-radius: 14px; padding: 6px 10px; display: flex; align-items: flex-end; gap: 8px; box-shadow: 0 8px 25px -8px rgba(0, 0, 0, .1); transition: border-color 0.2s, background 0.3s; }
        .input-box:focus-within { border-color: rgba(255, 184, 217, .8); box-shadow: 0 0 0 3px rgba(255, 184, 217, .2); }
        .attach-btn { background: none; border: none; color: var(--mut); font-size: 20px; cursor: pointer; padding: 6px; margin-bottom: 2px; border-radius: 8px; transition: all 0.2s; display: grid; place-items: center; }
        .attach-btn:hover { color: var(--accent); background: rgba(128, 128, 128, .1); }
        textarea { flex: 1; background: transparent; border: none; color: var(--tx); font-family: inherit; font-size: 16px; line-height: 1.5; padding: 8px 0; resize: none; outline: none; max-height: 150px; min-height: 24px; overflow-y: auto; }
        .send-btn { width: 34px; height: 34px; border-radius: 9px; background: var(--grad); border: none; color: var(--badge-tx); cursor: pointer; display: grid; place-items: center; transition: transform 0.2s, opacity 0.2s; margin-bottom: 2px; flex-shrink: 0; touch-action: manipulation; }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .send-btn.loading svg { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .footer-note { text-align: center; font-size: 10.5px; color: var(--mut); margin-top: 8px; width: 100%; }
        .ov { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .5); backdrop-filter: blur(6px); animation: fd 0.2s both; }
        @keyframes fd { from { opacity: 0; } to { opacity: 1; } }
        .preview-modal { width: 100%; height: 100%; max-width: 1200px; max-height: 90vh; background: #fff; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--bd2); }
        .preview-head { padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--bd); display: flex; justify-content: space-between; align-items: center; color: var(--tx); flex-shrink: 0; }
        .preview-body { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 80px); background: var(--card); border: 1px solid var(--bd2); padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .15); z-index: 200; opacity: 0; transition: all 0.3s; display: flex; align-items: center; gap: 6px; pointer-events: none; color: var(--tx); }
        .toast.s { transform: translate(-50%, 0); opacity: 1; }
        .toast .ok { color: #6ee7a8; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); max-width: 80vw; }
            .sidebar.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0, 0, 0, .2); }
            .sidebar-backdrop.show { display: block; opacity: 1; }
            .menu-toggle { display: block; }
            .top-bar-left { padding-left: 0; }
            .chat-container { padding: 16px; }
            .input-area { padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
            .msg.user .msg-content { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sb-head">
            <a class="logo" href="#">
                <div class="lm">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3c-3 0-5 1.7-5 4 0 1.3.7 2.4 1.8 3.1C7.5 10.9 6.5 12 6.5 13.4c0 1.7 1.3 3 3 3.3-.2.4-.3.9-.3 1.3 0 1.7 1.3 3 2.8 3s2.8-1.3 2.8-3c0-.4-.1-.9-.3-1.3 1.7-.3 3-1.6 3-3.3 0-1.4-1-2.5-2.3-2.9C16.3 9.4 17 8.3 17 7c0-2.3-2-4-5-4Z" fill="#1b1723"/></svg>
                </div>
                <div class="lt">Сметана <span>AI</span></div>
            </a>
        </div>
        <div class="sb-body">
            <button class="sb-btn primary" id="newChatBtn" type="button">＋ Новый чат</button>
            <div class="sb-title">История</div>
            <div id="chatHistoryList"></div>
        </div>
    </aside>

    <main class="main">
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" id="menuToggle" type="button">☰</button>
                <div class="model-selector-wrap" id="modelSelectorWrap">
                    <button class="model-selector" id="modelSelectorBtn" type="button">
                        <span class="dot"></span>
                        <span id="currentModelName">Сметана Base</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="model-dropdown" id="modelDropdown">
                        <div class="model-option active" data-model="base">Сметана Base</div>
                        <div class="model-option" data-model="ultra">
                            Сметана Ultra <span class="badge-test">test</span>
                        </div>
                    </div>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle" type="button" title="Сменить тему">🌙</button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="chat-inner" id="chatInner">
                <div class="msg system" id="welcomeMsg">
                    <div style="background:var(--card); padding:24px; border-radius:16px; border:1px solid var(--bd); text-align:center; max-width:320px; margin:0 auto; box-shadow:0 4px 15px rgba(0,0,0,0.05);">
                        <div style="font-size:36px; margin-bottom:12px;">🍦</div>
                        <h2 style="font-family:Unbounded; font-size:18px; margin-bottom:8px; color:var(--tx);">Привет, я Сметана</h2>
                        <p style="font-size:13px; color:var(--mut); line-height:1.5;">Твой личный ИИ-ассистент. Просто напиши мне что-нибудь!</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <div class="preview-container" id="previewContainer" hidden></div>
                <div class="input-box">
                    <button class="attach-btn" id="attachBtn" type="button" title="Прикрепить файл">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </button>
                    <input type="file" id="fileInput" multiple accept="image/*,video/*,audio/*" hidden>
                    <textarea id="chatInput" placeholder="Напишите сообщение..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" type="button">

        function formatMarkdown(text) {
            if (!text) return '';
            let processed = text
                .replace(/\\\[/g, '$$$$').replace(/\\\]/g, '$$$$')
                .replace(/\\\(/g, '$$').replace(/\\\)/g, '$$');
            processed = processed.replace(/(\\begin\{aligned\}[\s\S]*?\\end\{aligned\})/g, (match) => {
                if (!match.startsWith('$$') && !match.endsWith('$$')) return `$$${match}$$`;
                return match;
            });
            const mathBlocks = [];
            processed = processed.replace(/(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$)/g, (match) => {
                mathBlocks.push(match);
                return `%%MBLOCK${mathBlocks.length - 1}%%`;
            });
            let html = marked.parse(processed);
            mathBlocks.forEach((block, i) => {
                html = html.replace(`%%MBLOCK${i}%%`, block);
            });
            return html;
        }

        function processCodeBlocks(div) {
            if (typeof Prism === 'undefined') return;
            div.querySelectorAll('pre').forEach(pre => {
                if (pre.parentNode.classList.contains('code-block')) return;
                const codeEl = pre.querySelector('code');
                if (!codeEl) return;
                let lang = 'code';
                const match = codeEl.className.match(/language-(\w+)/);
                if (match) lang = match[1];
                let prismLang = lang === 'html' ? 'markup' : (lang === 'js' ? 'javascript' : lang);
                const rawCode = codeEl.textContent;
                if (Prism.languages[prismLang]) {
                    codeEl.innerHTML = Prism.highlight(rawCode, Prism.languages[prismLang], prismLang);
                }
                const wrapper = document.createElement('div');
                wrapper.className = 'code-block';
                const head = document.createElement('div');
                head.className = 'code-head';
                head.innerHTML = `<span>${lang}</span>`;
                const actions = document.createElement('div');
                actions.className = 'code-actions';

                const copyBtn = document.createElement('button');
                copyBtn.className = 'code-btn';
                copyBtn.type = 'button';
                copyBtn.innerHTML = 'Копировать';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(rawCode).then(() => toast('Скопировано'));
                };
                actions.appendChild(copyBtn);

                const dlBtn = document.createElement('button');
                dlBtn.className = 'code-btn';
                dlBtn.type = 'button';
                dlBtn.innerHTML = 'Скачать';
                dlBtn.onclick = () => {
                    const blob = new Blob([rawCode], { type: 'text/plain' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `smetana-code.${lang === 'html' ? 'html' : lang === 'css' ? 'css' : 'js'}`;
                    a.click();
                    URL.revokeObjectURL(a.href);
                };
                actions.appendChild(dlBtn);

                if (['html', 'css', 'js', 'javascript'].includes(lang.toLowerCase()) || rawCode.includes('<html') || rawCode.includes('<body')) {
                    const prBtn = document.createElement('button');
                    prBtn.className = 'code-btn primary';
                    prBtn.type = 'button';
                    prBtn.innerHTML = '▶ Предпросмотр';
                    prBtn.onclick = () => {
                        let previewContent = rawCode;
                        if (lang === 'css') previewContent = `<style>${rawCode}</style>`;
                        if (lang === 'js' || lang === 'javascript') previewContent = `<body><script>${rawCode}<\/script></body>`;
                        const iframe = $('#previewFrame');
                        iframe.srcdoc = previewContent;
                        $('#previewOv').hidden = false;
                    };
                    actions.appendChild(prBtn);
                }
                head.appendChild(actions);
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(head);
                wrapper.appendChild(pre);
            });
        }

        function appendMessageToDOM(role, text, shouldScroll = true, attachments = null, isStreaming = false) {
            const inner = $('#chatInner');
            const w = $('#welcomeMsg');
            if (w) w.remove();
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            if (role === 'user') {
                let attHtml = '';
                if (attachments && attachments.length) {
                    attHtml = `<div class="msg-attachments">` + attachments.map(f => {
                        if (f.type.startsWith('image/') && f.url) {
                            return `<img src="${f.url}" class="msg-att-img" alt="${esc(f.name)}">`;
                        } else {
                            return `<div class="msg-att-file">📄 ${esc(f.name)}</div>`;
                        }
                    }).join('') + `</div>`;
                }
                div.innerHTML = `<div class="msg-content">${attHtml}${esc(text)}</div>`;
            } else {
                let html = formatMarkdown(text);
                div.innerHTML = `<div class="msg-content md">${html}${isStreaming ? '<span class="streaming-cursor"></span>' : ''}</div>`;
                if (!isStreaming) {
                    try {
                        if (typeof renderMathInElement !== 'undefined') {
                            renderMathInElement(div, {
                                delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
                                throwOnError: false
                            });
                        }
                    } catch(e) {}
                    processCodeBlocks(div);
                }
            }
            inner.appendChild(div);
            if (shouldScroll) {
                if (role === 'user') scrollToBottom();
                else if (role === 'assistant') {
                    if (!isStreaming) {
                        const topPos = div.offsetTop - 20;
                        $('#chatContainer').scrollTo({ top: topPos, behavior: 'smooth' });
                    } else {
                        scrollToBottom();
                    }
                }
            }
            return div;
        }

        function scrollToBottom() {
            const c = $('#chatContainer');
            c.scrollTop = c.scrollHeight;
        }

        const attachBtn = $('#attachBtn');
        const fileInput = $('#fileInput');
        const previewContainer = $('#previewContainer');

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            for (const file of files) {
                const url = URL.createObjectURL(file);
                let base64 = null;
                if (file.type.startsWith('image/')) {
                    try { base64 = await toBase64(file); } catch(err) {}
                }
                st.currentFiles.push({ file, name: file.name, type: file.type, url, base64 });
            }
            renderPreviews();
            fileInput.value = '';
        });

        function renderPreviews() {
            if (st.currentFiles.length === 0) {
                previewContainer.hidden = true;
                previewContainer.innerHTML = '';
                return;
            }
            previewContainer.hidden = false;
            previewContainer.innerHTML = st.currentFiles.map((f, index) => {
                const isImage = f.type.startsWith('image/');
                const content = isImage ? `<img src="${f.url}" alt="">` : `<div class="file-icon">${f.type.startsWith('video/') ? '🎬' : '🎵'}</div>`;
                return `<div class="preview-item">${content}<button class="preview-remove" onclick="removeFile(${index})">✕</button></div>`;
            }).join('');
        }

        window.removeFile = function(index) {
            URL.revokeObjectURL(st.currentFiles[index].url);
            st.currentFiles.splice(index, 1);
            renderPreviews();
        };

        let isGenerating = false;
        const sendBtn = $('#sendBtn');
        const chatInput = $('#chatInput');

        async function sendMessage() {
            if (isGenerating) return;
            const text = chatInput.value.trim();
            if (!text && st.currentFiles.length === 0) return;

            chatInput.value = '';
            chatInput.style.height = 'auto';
            const attachmentsToSend = [...st.currentFiles];
            
            if (!st.activeChatId) {
                st.activeChatId = uid();
                st.chats.unshift({
                    id: st.activeChatId,
                    title: text.slice(0, 30) + (text.length > 30 ? '...' : '') || attachmentsToSend[0]?.name || 'Медиа',
                    messages: []
                });
            }
            
            const chat = st.chats.find(c => c.id === st.activeChatId);
            chat.messages.push({ role: 'user', content: text, attachments: attachmentsToSend });
            
            appendMessageToDOM('user', text, true, attachmentsToSend);
            save(); updateUI();
            
            st.currentFiles.forEach(f => URL.revokeObjectURL(f.url));
            st.currentFiles = [];
            renderPreviews();

            isGenerating = true;
            sendBtn.disabled = true;
            sendBtn.classList.add('loading');
            
            const inner = $('#chatInner');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'msg assistant';
            typingDiv.id = 'typingIndicator';
            let phraseIndex = Math.floor(Math.random() * loadingPhrases.length);

            typingDiv.innerHTML = `
                <div class="msg-content" style="display:flex; flex-direction:column; gap:4px; padding:12px;">
                    <div style="display:flex; gap:4px;">
                        <span class="dot" style="animation:pl 1s infinite"></span>
                        <span class="dot" style="animation:pl 1s infinite .2s"></span>
                        <span class="dot" style="animation:pl 1s infinite .4s"></span>
                    </div>
                    <span id="thinkingPhrase" style="font-size:12.5px; color:var(--mut); font-style:italic;">
                        ${loadingPhrases[phraseIndex]}
                    </span>
                </div>
            `;
            inner.appendChild(typingDiv);
            scrollToBottom();

            const phraseEl = typingDiv.querySelector('#thinkingPhrase');
            const phraseInterval = setInterval(() => {
                let newIndex = Math.floor(Math.random() * loadingPhrases.length);
                while (newIndex === phraseIndex && loadingPhrases.length > 1) {
                    newIndex = Math.floor(Math.random() * loadingPhrases.length);
                }
                phraseIndex = newIndex;
                if (phraseEl) {
                    phraseEl.style.opacity = '0';
                    setTimeout(() => {
                        if (phraseEl) {
                            phraseEl.textContent = loadingPhrases[phraseIndex];
                            phraseEl.style.opacity = '1';
                        }
                    }, 250);
                }
            }, 2500);

            const sysPrompt = `Ты — Сметана AI. Твоя цель — общаться как обычный, живой и дружелюбный человек.
Правила:
1. Отвечай максимально просто, коротко и понятно. Не пиши длинные лекции, если тебя об этом не просят.
2. Не используй шаблонные фразы ассистентов (типа 'Чем я могу помочь?'). Веди диалог естественно.
3. Если пользователь пишет что-то повторяющееся (например, много раз 'привет'), просто отвечай в том же духе, не задавай странных вопросов.
4. НИКОГДА не называй себя Llama, GPT, Qwen, DeepSeek, Nemotron, Gemini и т.д. Ты — Сметана.
5. Используй Markdown. НО таблицы используй ТОЛЬКО когда нужно сравнить данные (например, характеристики). В остальных случаях оформляй ответы обычными списками!
6. Для математики используй ТОЛЬКО знаки $ (для формул в тексте) и $$ (для отдельных формул на новой строке). КАТЕГОРИЧЕСКИ запрещено использовать \\[ \\] или \\( \\), так как парсер их не понимает!
7. Если пишешь код, всегда указывай язык.
8. Если пользователь прислал изображение, внимательно рассмотри его и опиши, что на нем, или ответь на вопрос пользователя по картинке.`;

            const messages = [
                { role: 'system', content: sysPrompt },
                ...chat.messages.map((msg, i) => {
                    const isLast = (i === chat.messages.length - 1);
                    if (isLast && attachmentsToSend.length > 0) {
                        const contentArray = [];
                        if (msg.content && msg.content.trim()) {
                            contentArray.push({ type: "text", text: msg.content });
                        } else {
                            contentArray.push({ type: "text", text: "Опиши это." });
                        }
                        attachmentsToSend.forEach(f => {
                            if (f.type.startsWith('image/') && f.base64) {
                                contentArray.push({ type: "image_url", image_url: { url: f.base64 } });
                            } else {
                                contentArray.push({ type: "text", text: `[Пользователь прикрепил файл: ${f.name}]` });
                            }
                        });
                        return { role: msg.role, content: contentArray };
                    }
                    return { role: msg.role, content: msg.content };
                })
            ];

            let activeUrl, activeKey, activeModelId;
            if (st.activeModel === 'ultra') {
                activeUrl = API_URL_ULTRA;
                activeKey = API_KEY_ULTRA;
                activeModelId = REAL_MODEL_ID_ULTRA;
            } else {
                activeUrl = API_URL_BASE;
                activeKey = API_KEY_BASE;
                activeModelId = REAL_MODEL_ID_BASE;
            }

            try {
                const res = await fetch(activeUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + activeKey
                    },
                    body: JSON.stringify({ 
                        model: activeModelId, 
                        messages: messages,
                        temperature: 0.7,
                        stream: true
                    })
                });

                if (!res.ok) {
                    let err = 'HTTP ' + res.status;
                    try { const j = await res.json(); err = j.error?.message || j.error || JSON.stringify(j); } catch(e){}
                    throw new Error(err);
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let fullReply = '';
                let assistantMsgDiv = null;
                let isFirstChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ') && line.trim() !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                const delta = data.choices[0]?.delta?.content || '';
                                if (delta) {
                                    if (isFirstChunk) {
                                        clearInterval(phraseInterval);
                                        typingDiv.remove();
                                        assistantMsgDiv = appendMessageToDOM('assistant', '', true, null, true);
                                        isFirstChunk = false;
                                    }
                                    fullReply += delta;
                                    const msgContentDiv = assistantMsgDiv.querySelector('.msg-content');
                                    msgContentDiv.innerHTML = formatMarkdown(fullReply) + '<span class="streaming-cursor"></span>';
                                    scrollToBottom();
                                }
                            } catch (e) {}
                        }
                    }
                }

                if (assistantMsgDiv) {
                    const msgContentDiv = assistantMsgDiv.querySelector('.msg-content');
                    msgContentDiv.innerHTML = formatMarkdown(fullReply);
                    
                    try {
                        if (typeof renderMathInElement !== 'undefined') {
                            renderMathInElement(msgContentDiv, {
                                delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
                                throwOnError: false
                            });
                        }
                    } catch(e) {}
                    
                    processCodeBlocks(msgContentDiv);
                    chat.messages.push({ role: 'assistant', content: fullReply });
                    save();
                } else {
                    typingDiv.remove();
                    appendMessageToDOM('system', '⚠ Модель вернула пустой ответ.', true);
                }

            } catch(err) {
                clearInterval(phraseInterval);
                if (typingDiv) typingDiv.remove();
                appendMessageToDOM('system', '⚠ Ошибка: ' + err.message, true);
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
                sendBtn.classList.remove('loading');
                if (window.innerWidth > 768) chatInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        const sidebar = $('#sidebar');
        const backdrop = $('#sidebarBackdrop');
        
        function openSidebar() {
            sidebar.classList.add('open');
            backdrop.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        function closeSidebar() {
            sidebar.classList.remove('open');
            backdrop.classList.remove('show');
        }
        
        $('#menuToggle').addEventListener('click', openSidebar);
        backdrop.addEventListener('click', closeSidebar);
        
        document.querySelectorAll('[data-close]').forEach(b => {
            b.onclick = (e) => { e.target.closest('.ov').hidden = true; };
        });
        
        document.querySelectorAll('.ov').forEach(ov => {
            ov.onclick = e => { if (e.target === ov) ov.hidden = true; };
        });

        updateModelUI();
        updateUI();
        loadChat(st.activeChatId);
    </script>
</body>
</html>
