<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Сметана AI</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
<style>
:root{
  --bg:#07070b;--sb-bg:#0c0b12;--card:#14121c;--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.15);
  --tx:#EDE9E3;--mut:#8d8a94;--grad:linear-gradient(120deg,#FFE3A3,#FFB8D9 45%,#B3A8FF);
  --accent:#FFB8D9;--user-bg:rgba(255,255,255,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: Manrope, system-ui, sans-serif;
  display: flex;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:100px}
.sidebar{
  width:260px;flex-shrink:0;background:var(--sb-bg);border-right:1px solid var(--bd);
  display:flex;flex-direction:column;height:100%;z-index:50;
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sb-head{padding:16px 20px;border-bottom:1px solid var(--bd);flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.lm{width:32px;height:32px;border-radius:9px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 20px -6px rgba(255,184,217,.6)}
.lm svg{width:16px;height:16px}
.lt{font-family:Unbounded,sans-serif;font-size:14px;font-weight:700}
.lt span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-body{padding:12px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;overscroll-behavior: contain;}
.sb-btn{
  width:100%;padding:10px;border-radius:8px;border:1px dashed var(--bd2);background:transparent;
  color:var(--tx);font-family:inherit;font-size:13px;font-weight:600;display:flex;align-items:center;
  gap:8px;cursor:pointer;transition:all .2s;text-align:left;touch-action:manipulation;
}
.sb-btn:hover{background:rgba(255,255,255,.05);border-color:var(--accent)}
.sb-btn.primary{background:var(--grad);border:none;color:#17131f;justify-content:center;box-shadow:0 4px 15px -4px rgba(255,184,217,.5);margin-bottom:8px}
.sb-btn.primary:hover{transform:translateY(-1px)}
.sb-title{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px 4px}
.chat-item{
  padding:10px 36px 10px 10px;border-radius:8px;font-size:12.5px;color:#c8c2d4;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;
  transition:background .2s;position:relative;touch-action:manipulation;
}
.chat-item:hover{background:rgba(255,255,255,.06)}
.chat-item.active{background:rgba(255,255,255,.1);color:#fff}
.chat-item .del-btn{
  position:absolute; right:6px; top:50%; transform:translateY(-50%); opacity:0.4; font-size:14px;
  color:var(--mut); background:transparent; border:none; cursor:pointer; transition:all .2s;
  padding:6px; border-radius:6px; display:grid; place-items:center; touch-action:manipulation;
}
.chat-item:hover .del-btn{opacity:1;}
.chat-item .del-btn:hover{background:rgba(255,255,255,.1); color:#fff;}
.sidebar-backdrop{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
  backdrop-filter:blur(4px); z-index:45; opacity:0; transition:opacity 0.3s;
}
.main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0;position:relative;min-height:0;}
.top-bar{
  padding:14px 20px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--bd);
  background:rgba(7,7,11,.8);backdrop-filter:blur(10px);flex-shrink:0;z-index:10;
}
.model-indicator{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--tx)}
.dot{width:7px;height:7px;border-radius:50%;background:#6ee7a8;box-shadow:0 0 8px #6ee7a8}
.menu-toggle{
  display:none;position:absolute;left:16px;background:none;border:none;color:var(--tx);
  font-size:24px;cursor:pointer;padding:4px 8px;touch-action:manipulation;z-index:60;
}
.chat-container{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;
  scroll-behavior:smooth;overscroll-behavior-y:contain;
  padding:20px; min-height:0;
}
.chat-inner{
  max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:20px;
}
.msg{display:flex;gap:12px;animation:up .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.msg-content{font-size:14.5px;line-height:1.6;word-wrap:break-word;overflow-wrap:anywhere;}
.msg.user .msg-content{background:var(--user-bg);padding:10px 16px;border-radius:16px 16px 4px 16px;border:1px solid var(--bd);max-width:85%;}
.msg.assistant .msg-content{padding:0;width:100%;}
.msg.system{align-self:center;justify-content:center;color:var(--mut);font-size:12.5px;text-align:center;margin:10px 0;}
.md h1,.md h2,.md h3{margin:16px 0 8px;font-weight:700;color:#fff;line-height:1.3}
.md h1{font-size:20px}.md h2{font-size:18px}.md h3{font-size:16px}
.md p{margin-bottom:10px}
.md ul,.md ol{margin:0 0 10px 18px}
.md li{margin-bottom:4px}
.md strong{font-weight:700;color:#fff}
.md blockquote{border-left:3px solid var(--accent);padding-left:10px;color:var(--mut);margin-bottom:10px}
.md table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--bd2);padding:6px 10px;text-align:left;word-break:break-word;}
.md th{background:rgba(255,255,255,.05);font-weight:600}
.md tr:nth-child(even){background:rgba(255,255,255,.02)}
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 8px 0; margin: 8px 0; }
.katex { font-size: 1.1em; }
.code-block{margin:14px 0;border-radius:8px;border:1px solid var(--bd2);background:#0d0d12;overflow:hidden}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--bd);font-size:11.5px;font-family:'JetBrains Mono',monospace;color:var(--mut)}
.code-actions{display:flex;gap:4px}
.code-btn{background:transparent;border:1px solid var(--bd);color:var(--mut);font-size:11px;padding:2px 6px;border-radius:4px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:4px;touch-action:manipulation;}
.code-btn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:var(--bd2)}
.code-btn.primary{background:rgba(255,184,217,.15);color:var(--accent);border-color:rgba(255,184,217,.3)}
.code-btn.primary:hover{background:rgba(255,184,217,.25)}
.code-block pre{margin:0;padding:12px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5;color:#e2e2e2}
.code-block code{font-family:inherit;background:none;padding:0}
.input-area{padding:16px 20px;background:linear-gradient(180deg,transparent,var(--bg) 40%);flex-shrink:0;display:flex;flex-direction:column;align-items:center;}
.input-wrapper{max-width:760px;width:100%;margin:0 auto;}
.input-box{
  position:relative;background:var(--card);border:1px solid var(--bd2);border-radius:14px;
  padding:6px 10px;display:flex;align-items:flex-end;gap:8px;
  box-shadow:0 8px 25px -8px rgba(0,0,0,.6);transition:border-color .2s;
}
.input-box:focus-within{border-color:rgba(255,184,217,.5);box-shadow:0 0 0 3px rgba(255,184,217,.1)}
textarea{
  flex:1;background:transparent;border:none;color:var(--tx);font-family:inherit;font-size:16px;
  line-height:1.5;padding:8px 0;resize:none;outline:none;max-height:150px;min-height:24px;overflow-y:auto;
}
.send-btn{
  width:34px;height:34px;border-radius:9px;background:var(--grad);border:none;color:#17131f;
  cursor:pointer;display:grid;place-items:center;transition:transform .2s,opacity .2s;margin-bottom:2px;flex-shrink:0;
  touch-action:manipulation;
}
.send-btn:hover{transform:scale(1.05)}
.send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.send-btn.loading svg{animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
.footer-note{text-align:center;font-size:10.5px;color:var(--mut);margin-top:8px;width:100%}
.ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(4,4,8,.8);backdrop-filter:blur(6px);animation:fd .2s both}
@keyframes fd{from{opacity:0}to{opacity:1}}
.preview-modal{width:100%;height:100%;max-width:1200px;max-height:90vh;background:#fff;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--bd2)}
.preview-head{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;color:var(--tx);flex-shrink:0}
.preview-body{flex:1;border:none;width:100%;height:100%;background:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:var(--card);border:1px solid var(--bd2);padding:10px 20px;border-radius:100px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.8);z-index:200;opacity:0;transition:all .3s;display:flex;align-items:center;gap:6px;pointer-events:none}
.toast.s{transform:translate(-50%,0);opacity:1}
.toast .ok{color:#6ee7a8}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;height:100%;transform:translateX(-100%);max-width:80vw;}
  .sidebar.open{transform:translateX(0);box-shadow:10px 0 30px rgba(0,0,0,.8)}
  .sidebar-backdrop.show{display:block;opacity:1;}
  .menu-toggle{display:block}
  .top-bar{justify-content:flex-start;padding-left:56px}
  .chat-container{padding:16px}
  .input-area{padding:12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom));}
  .msg.user .msg-content{max-width:90%;}
}
</style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <a class="logo" href="#">
      <div class="lm"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3c-3 0-5 1.7-5 4 0 1.3.7 2.4 1.8 3.1C7.5 10.9 6.5 12 6.5 13.4c0 1.7 1.3 3 3 3.3-.2.4-.3.9-.3 1.3 0 1.7 1.3 3 2.8 3s2.8-1.3 2.8-3c0-.4-.1-.9-.3-1.3 1.7-.3 3-1.6 3-3.3 0-1.4-1-2.5-2.3-2.9C16.3 9.4 17 8.3 17 7c0-2.3-2-4-5-4Z" fill="#1b1723"/></svg></div>
      <div class="lt">Сметана <span>AI</span></div>
    </a>
  </div>
  <div class="sb-body">
    <button class="sb-btn primary" id="newChatBtn" type="button">＋ Новый чат</button>
    <div class="sb-title">История</div>
    <div id="chatHistoryList"></div>
  </div>
</aside>
<main class="main">
  <div class="top-bar">
    <button class="menu-toggle" id="menuToggle" type="button">☰</button>
    <div class="model-indicator">
      <span class="dot"></span>
      <span>Сметана AI (smetana-ai-beta-2.0)</span>
    </div>
  </div>
  <div class="chat-container" id="chatContainer">
    <div class="chat-inner" id="chatInner">
      <div class="msg system" id="welcomeMsg">
        <div style="background:var(--card);padding:24px;border-radius:16px;border:1px solid var(--bd);text-align:center;max-width:320px;margin:0 auto;">
          <div style="font-size:36px;margin-bottom:12px">🍦</div>
          <h2 style="font-family:Unbounded;font-size:18px;margin-bottom:8px;color:#fff">Привет, я Сметана</h2>
          <p style="font-size:13px;color:var(--mut);line-height:1.5">Твой личный ИИ-ассистент. Просто напиши мне что-нибудь!</p>
        </div>
      </div>
    </div>
  </div>
  <div class="input-area">
    <div class="input-wrapper">
      <div class="input-box">
        <textarea id="chatInput" placeholder="Напишите сообщение..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
      <div class="footer-note">Сметана AI может допускать ошибки.</div>
    </div>
  </div>
</main>
<div class="ov" id="previewOv" hidden><div class="preview-modal"><div class="preview-head"><span style="font-size:13px;font-weight:600">Предпросмотр</span><button class="code-btn" data-close type="button">Закрыть</button></div><iframe class="preview-body" id="previewFrame"></iframe></div></div>
<div class="toast" id="toast"><span class="ok">✓</span><span id="toastText"></span></div>
<script>
/* ================= НАСТРОЙКИ ================= */
const API_KEY = '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';
const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
// Авто-роутер всегда выбирает лучшую доступную бесплатную модель
const REAL_MODEL_ID = 'openrouter/free'; 

/* ================= ЛОГИКА ================= */
const $ = s => document.querySelector(s);
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e) { return []; } };
const st = {
  chats: load('schats'),
  activeChatId: localStorage.getItem('sactive') || null
};
const save = () => {
  localStorage.setItem('schats', JSON.stringify(st.chats));
  if(st.activeChatId) localStorage.setItem('sactive', st.activeChatId);
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;
const toast = m => {
  const t = $('#toast'); 
  $('#toastText').textContent = m;
  t.classList.add('s');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('s'), 2000);
};
marked.setOptions({
  highlight: function(code, lang) {
    if (Prism.languages[lang]) return Prism.highlight(code, Prism.languages[lang], lang);
    return code;
  }
});
function updateUI(){
  const list = $('#chatHistoryList');
  list.innerHTML = st.chats.map(c => `
    <div class="chat-item ${c.id === st.activeChatId ? 'active' : ''}" data-id="${c.id}">
      <span style="overflow:hidden;text-overflow:ellipsis;pointer-events:none;">${esc(c.title)}</span>
      <button class="del-btn" data-act="del-chat" type="button" title="Удалить чат">🗑️</button>
    </div>
  `).join('');
}
$('#chatHistoryList').addEventListener('click', e => {
  const item = e.target.closest('.chat-item');
  if(!item) return;
  if(e.target.closest('[data-act="del-chat"]')){
    e.stopPropagation();
    st.chats = st.chats.filter(c => c.id !== item.dataset.id);
    if(st.activeChatId === item.dataset.id) st.activeChatId = st.chats[0]?.id || null;
    save(); updateUI(); loadChat(st.activeChatId);
    return;
  }
  st.activeChatId = item.dataset.id;
  save(); updateUI(); loadChat(st.activeChatId);
  if(window.innerWidth <= 768) closeSidebar();
});
$('#newChatBtn').addEventListener('click', () => {
  st.activeChatId = null;
  save(); updateUI(); loadChat(null);
  $('#chatInput').focus();
  if(window.innerWidth <= 768) closeSidebar();
});
function loadChat(id){
  const inner = $('#chatInner');
  inner.innerHTML = '';
  if(!id){
    inner.innerHTML = `
      <div class="msg system" id="welcomeMsg">
        <div style="background:var(--card);padding:24px;border-radius:16px;border:1px solid var(--bd);text-align:center;max-width:320px;margin:0 auto;">
          <div style="font-size:36px;margin-bottom:12px">🍦</div>
          <h2 style="font-family:Unbounded;font-size:18px;margin-bottom:8px;color:#fff">Привет, я Сметана</h2>
          <p style="font-size:13px;color:var(--mut);line-height:1.5">Твой личный ИИ-ассистент. Просто напиши мне что-нибудь!</p>
        </div>
      </div>`;
    return;
  }
  const chat = st.chats.find(c => c.id === id);
  if(!chat) return;
  chat.messages.forEach((msg) => {
    appendMessageToDOM(msg.role, msg.content, false);
  });
  scrollToBottom();
}
function formatMarkdown(text) {
  let processed = text
    .replace(/\\\[/g, '$$$$')
    .replace(/\\\]/g, '$$$$')
    .replace(/\\\(/g, '$$')
    .replace(/\\\)/g, '$$');
  processed = processed.replace(/(\\begin\{aligned\}[\s\S]*?\\end\{aligned\})/g, (match) => {
    if (!match.startsWith('$$') && !match.endsWith('$$')) return `$$${match}$$`;
    return match;
  });
  const mathBlocks = [];
  processed = processed.replace(/(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$)/g, (match) => {
    mathBlocks.push(match);
    return `%%MBLOCK${mathBlocks.length - 1}%%`;
  });
  let html = marked.parse(processed);
  mathBlocks.forEach((block, i) => {
    html = html.replace(`%%MBLOCK${i}%%`, block);
  });
  return html;
}
function appendMessageToDOM(role, text, shouldScroll = true){
  const inner = $('#chatInner');
  const w = $('#welcomeMsg');
  if(w) w.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if(role === 'user'){
    div.innerHTML = `<div class="msg-content">${esc(text)}</div>`;
  } else {
    let html = formatMarkdown(text);
    div.innerHTML = `<div class="msg-content md">${html}</div>`;
    try {
      renderMathInElement(div, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    } catch(e) {}
    div.querySelectorAll('pre').forEach(pre => {
      const codeEl = pre.querySelector('code');
      if(!codeEl) return;
      let lang = 'code';
      const match = codeEl.className.match(/language-(\w+)/);
      if(match) lang = match[1];
      const rawCode = codeEl.textContent;
      const wrapper = document.createElement('div');
      wrapper.className = 'code-block';
      const head = document.createElement('div');
      head.className = 'code-head';
      head.innerHTML = `<span>${lang}</span>`;
      const actions = document.createElement('div');
      actions.className = 'code-actions';
      const copyBtn = document.createElement('button');
      copyBtn.className = 'code-btn';
      copyBtn.type = 'button';
      copyBtn.innerHTML = 'Копировать';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(rawCode).then(() => toast('Скопировано'));
      };
      actions.appendChild(copyBtn);
      const dlBtn = document.createElement('button');
      dlBtn.className = 'code-btn';
      dlBtn.type = 'button';
      dlBtn.innerHTML = 'Скачать';
      dlBtn.onclick = () => {
        const blob = new Blob([rawCode], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `smetana-code.${lang === 'html' ? 'html' : lang === 'css' ? 'css' : 'js'}`;
        a.click();
        URL.revokeObjectURL(a.href);
      };
      actions.appendChild(dlBtn);
      if(['html','css','js','javascript'].includes(lang.toLowerCase()) || rawCode.includes('<html') || rawCode.includes('<body')){
        const prBtn = document.createElement('button');
        prBtn.className = 'code-btn primary';
        prBtn.type = 'button';
        prBtn.innerHTML = '▶ Предпросмотр';
        prBtn.onclick = () => {
          let previewContent = rawCode;
          if(lang === 'css') previewContent = `<style>${rawCode}</style>`;
          if(lang === 'js' || lang === 'javascript') previewContent = `<body><script>${rawCode}<\/script></body>`;
          const iframe = $('#previewFrame');
          iframe.srcdoc = previewContent;
          $('#previewOv').hidden = false;
        };
        actions.appendChild(prBtn);
      }
      head.appendChild(actions);
      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(head);
      wrapper.appendChild(pre);
    });
  }
  inner.appendChild(div);
  if (shouldScroll) {
    if (role === 'user') {
      scrollToBottom();
    } else if (role === 'assistant') {
      const topPos = div.offsetTop - 20;
      $('#chatContainer').scrollTo({ top: topPos, behavior: 'smooth' });
    }
  }
}
function scrollToBottom(){
  const c = $('#chatContainer');
  c.scrollTop = c.scrollHeight;
}
let isGenerating = false;
const sendBtn = $('#sendBtn');
const chatInput = $('#chatInput');
async function sendMessage(){
  if(isGenerating) return;
  const text = chatInput.value.trim();
  if(!text) return;
  chatInput.value = '';
  chatInput.style.height = 'auto';
  if(!st.activeChatId){
    st.activeChatId = uid();
    st.chats.unshift({
      id: st.activeChatId,
      title: text.slice(0, 30) + (text.length > 30 ? '...' : ''),
      messages: []
    });
  }
  const chat = st.chats.find(c => c.id === st.activeChatId);
  chat.messages.push({role:'user', content:text});
  appendMessageToDOM('user', text, true);
  save(); updateUI();
  isGenerating = true;
  sendBtn.disabled = true;
  sendBtn.classList.add('loading');
  const inner = $('#chatInner');
  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg assistant';
  typingDiv.id = 'typingIndicator';
  typingDiv.innerHTML = `<div class="msg-content" style="display:flex;gap:4px;padding:12px"><span class="dot" style="animation:pl 1s infinite"></span><span class="dot" style="animation:pl 1s infinite .2s"></span><span class="dot" style="animation:pl 1s infinite .4s"></span></div>`;
  inner.appendChild(typingDiv);
  scrollToBottom();
  const sysPrompt = `Ты — Сметана AI. Твоя цель — общаться как обычный, живой и дружелюбный человек.
Правила:
1. Отвечай максимально просто, коротко и понятно. Не пиши длинные лекции, если тебя об этом не просят.
2. Не используй шаблонные фразы ассистентов (типа 'Чем я могу помочь?'). Веди диалог естественно.
3. Если пользователь пишет что-то повторяющееся (например, много раз 'привет'), просто отвечай в том же духе, не задавай странных вопросов.
4. НИКОГДА не называй себя Llama, GPT, Qwen и т.д. Ты — Сметана.
5. Используй Markdown. НО таблицы используй ТОЛЬКО когда нужно сравнить данные (например, характеристики). В остальных случаях оформляй ответы обычными списками!
6. Для математики используй ТОЛЬКО знаки $ (для формул в тексте) и $$ (для отдельных формул на новой строке). КАТЕГОРИЧЕСКИ запрещено использовать \\[ \\] или \\( \\), так как парсер их не понимает!
7. Если пишешь код, всегда указывай язык.`;
  const messages = [
    { role: 'system', content: sysPrompt },
    ...chat.messages.map(msg => ({ role: msg.role, content: msg.content }))
  ];
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY,
        'HTTP-Referer': 'https://smetana.ai',
        'X-Title': 'Smetana AI'
      },
      body: JSON.stringify({ 
        model: REAL_MODEL_ID, 
        messages: messages,
        temperature: 0.7
      })
    });
    if(!res.ok) {
      let err = 'HTTP ' + res.status;
      try { const j = await res.json(); err = j.error?.message || j.error || JSON.stringify(j); } catch(e){}
      throw new Error(err);
    }
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content;
    if(!reply) throw new Error('Пустой ответ');
    typingDiv.remove();
    chat.messages.push({role:'assistant', content:reply});
    appendMessageToDOM('assistant', reply, true);
    save();
  } catch(err) {
    typingDiv.remove();
    appendMessageToDOM('system', '⚠ Ошибка: ' + err.message, true);
  } finally {
    isGenerating = false;
    sendBtn.disabled = false;
    sendBtn.classList.remove('loading');
    if(window.innerWidth > 768) chatInput.focus();
  }
}
sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = (this.scrollHeight) + 'px';
});
const sidebar = $('#sidebar');
const backdrop = $('#sidebarBackdrop');
function openSidebar() {
  sidebar.classList.add('open');
  backdrop.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSidebar() {
  sidebar.classList.remove('open');
  backdrop.classList.remove('show');
}
$('#menuToggle').addEventListener('click', openSidebar);
backdrop.addEventListener('click', closeSidebar);
document.querySelectorAll('[data-close]').forEach(b => {
  b.onclick = (e) => { e.target.closest('.ov').hidden = true; };
});
document.querySelectorAll('.ov').forEach(ov => {
  ov.onclick = e => { if(e.target === ov) ov.hidden = true; };
});
updateUI();
loadChat(st.activeChatId);
</script>
</body>
